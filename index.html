<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Roboto', sans-serif;
        }
        .container {
            margin-top: 100px;
            margin-bottom: 60px;
        }
        .card {
            background-color: #1e1e1e;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        /* The hover transform creates a stacking context that traps the
           dropdown menu, so lift the active card above its neighbours. */
        .card:hover,
        .card:focus-within,
        .card:has(.dropdown-menu.show) {
            z-index: 10;
        }
        .gallery {
            position: relative;
        }
        .card-thumb {
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 8px;
            background-color: #2a2a2a;
            display: block;
        }
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            border: none;
            background-color: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 1.1rem;
            line-height: 1;
            padding: 0;
            opacity: 0.75;
            transition: opacity 0.15s, background-color 0.15s;
        }
        .gallery:hover .gallery-arrow,
        .gallery-arrow:focus-visible {
            opacity: 1;
        }
        .gallery-arrow:hover {
            background-color: #bb86fc;
            color: #000;
        }
        .gallery-prev {
            left: 8px;
        }
        .gallery-next {
            right: 8px;
        }
        .gallery-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 0.75rem;
            border-radius: 999px;
            padding: 0.1rem 0.5rem;
        }
        .card-title {
            color: #ffffff;
            font-weight: 500;
        }
        .card-text {
            color: #b0b0b0;
        }
        .card-updated {
            color: #808080;
            font-size: 0.85rem;
        }
        .badge {
            background-color: #bb86fc;
            color: #000;
        }
        .model-tag {
            display: inline-block;
            border: 1px solid #03dac6;
            color: #03dac6;
            border-radius: 999px;
            padding: 0.1rem 0.6rem;
            font-size: 0.75rem;
        }
        .info-toggle {
            width: 1.3rem;
            height: 1.3rem;
            border-radius: 50%;
            border: 1px solid #808080;
            background: none;
            color: #808080;
            font: italic 600 0.75rem/1 Georgia, serif;
            padding: 0;
        }
        .info-toggle:hover,
        .info-toggle[aria-expanded="true"] {
            border-color: #03dac6;
            color: #03dac6;
        }
        .btn-primary {
            background-color: #03dac6;
            border: none;
            color: #000;
        }
        .btn-primary:hover {
            background-color: #018786;
            color: #fff;
        }
        .link-accent {
            color: #bb86fc;
            text-decoration: none;
        }
        .link-accent:hover {
            color: #03dac6;
        }
        .context-toggle {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.85rem;
        }
        .context-toggle::after {
            content: " \25BE";
        }
        .context-toggle[aria-expanded="true"]::after {
            content: " \25B4";
        }
        .context-text {
            color: #b0b0b0;
            font-size: 0.9rem;
            border-left: 2px solid #bb86fc;
            padding-left: 0.75rem;
        }
        h1 {
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }
        h2 {
            font-weight: 500;
            font-size: 1.4rem;
            color: #ffffff;
            margin: 48px 0 0;
        }
        .sort-toggle .btn {
            color: #b0b0b0;
            border-color: #444;
        }
        .sort-toggle .btn.active {
            background-color: #bb86fc;
            border-color: #bb86fc;
            color: #000;
        }
        .model-filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 0.75rem;
        }
        .model-chip {
            border: 1px solid #444;
            background: none;
            color: #b0b0b0;
            border-radius: 999px;
            padding: 0.15rem 0.7rem;
            font-size: 0.8rem;
            line-height: 1.5;
            max-width: 100%;
            overflow-wrap: anywhere;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }
        .model-chip:hover {
            border-color: #03dac6;
            color: #03dac6;
        }
        .model-chip[aria-pressed="true"] {
            background-color: rgba(3, 218, 198, 0.15);
            border-color: #03dac6;
            color: #03dac6;
        }
        .model-chip[aria-pressed="false"] {
            text-decoration: line-through;
            opacity: 0.7;
        }
        .model-chip.all-chip[aria-pressed="false"],
        .model-chip.none-chip[aria-pressed="false"] {
            text-decoration: none;
        }
        .model-chip:focus-visible,
        .sort-toggle .btn:focus-visible {
            outline: 2px solid #bb86fc;
            outline-offset: 2px;
        }
        .no-match {
            color: #808080;
        }
        .version-menu {
            max-height: 260px;
            overflow-y: auto;
        }
        .footnote {
            color: #808080;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 48px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vibes</h1>
        <div class="d-flex justify-content-center">
            <div class="btn-group btn-group-sm sort-toggle" role="group" aria-label="Sort order">
                <button type="button" class="btn btn-outline-secondary" data-sort="default">Default order</button>
                <button type="button" class="btn btn-outline-secondary" data-sort="updated">Recently updated</button>
            </div>
        </div>
        <div class="model-filter" id="model-filter" role="group" aria-label="Filter by model"></div>
        <p class="text-center mt-3 mb-0"><a href="versions.html" class="link-accent">Version logs for every game</a></p>
        <section>
            <h2>Games</h2>
            <div class="row" id="games"></div>
        </section>
        <section>
            <h2>Apps</h2>
            <div class="row" id="apps"></div>
        </section>
        <p class="footnote">"Opus" means the newest Opus model at the time it was made.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // All card content lives in games.json; scripts/import_godot_build.py keeps it up to date.
        const PLACEHOLDER = "Thumbnails/placeholder.svg";
        let projects = [];

        const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
        // Same ids as scripts/build_version_logs.py, so cards can deep-link into versions.html.
        const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        const fmtDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"});

        function playControl(p) {
            const verb = p.kind === "app" ? "Open App" : "Play Now";
            if (p.versions.length === 1) {
                return `<a href="${esc(p.versions[0].href)}" class="btn btn-primary w-100">${verb}</a>`;
            }
            const items = p.versions.map((v, i) => {
                const label = esc(v.version) + (v.label ? ` &mdash; ${esc(v.label)}` : "") + (i === 0 ? " (Latest)" : "");
                return `<li><a class="dropdown-item" href="${esc(v.href)}">${label}</a></li>`;
            }).join("");
            return `<div class="dropdown">
                <button class="btn btn-primary w-100 dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Play Version</button>
                <ul class="dropdown-menu w-100 version-menu">${items}</ul>
            </div>`;
        }

        // Only the visible image is in the DOM, so a card's other screenshots load when you click to them.
        function gallery(p, i) {
            const images = p.images && p.images.length ? p.images : [PLACEHOLDER];
            const arrows = images.length > 1 ? `
                <button class="gallery-arrow gallery-prev" type="button" data-gallery="${i}" data-step="-1" aria-label="Previous image">&#8249;</button>
                <button class="gallery-arrow gallery-next" type="button" data-gallery="${i}" data-step="1" aria-label="Next image">&#8250;</button>
                <span class="gallery-count">1 / ${images.length}</span>` : "";
            return `<div class="gallery mb-3" data-index="0">
                <img class="card-thumb w-100" src="${esc(images[0])}" alt="${esc(p.title)} screenshot 1" loading="lazy">${arrows}
            </div>`;
        }

        document.addEventListener("click", e => {
            const btn = e.target.closest(".gallery-arrow");
            if (!btn) return;
            const p = projects[btn.dataset.gallery];
            const box = btn.closest(".gallery");
            const n = p.images.length;
            const index = (Number(box.dataset.index) + Number(btn.dataset.step) + n) % n;
            box.dataset.index = index;
            const img = box.querySelector("img");
            img.src = p.images[index];
            img.alt = `${p.title} screenshot ${index + 1}`;
            box.querySelector(".gallery-count").textContent = `${index + 1} / ${n}`;
        });

        function card(p, i) {
            const ctxId = `context-${i}`;
            const modelId = `model-${i}`;
            return `<div class="col-md-6 col-lg-4 mt-4">
                <div class="card p-3 h-100">
                    <div class="card-body d-flex flex-column">
                        ${gallery(p, i)}
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title mb-0">${esc(p.title)}</h5>
                            <div class="d-flex align-items-center gap-2 flex-shrink-0">
                                ${p.model ? `<button class="info-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#${modelId}" aria-expanded="false" aria-controls="${modelId}" aria-label="Show model used" title="Model used">i</button>` : ""}
                                <span class="badge rounded-pill">${esc(p.versions[0].version)}</span>
                            </div>
                        </div>
                        ${p.model ? `<div class="collapse" id="${modelId}"><div class="mb-2"><span class="model-tag">Made with ${esc(p.model)}</span></div></div>` : ""}
                        <p class="card-text">${esc(p.description)}</p>
                        ${p.updated ? `<p class="card-updated mb-0">Updated <time datetime="${esc(p.updated)}">${fmtDate(p.updated)}</time></p>` : ""}
                        ${p.context ? `<div class="mt-2">
                            <button class="context-toggle link-accent" type="button" data-bs-toggle="collapse" data-bs-target="#${ctxId}" aria-expanded="false" aria-controls="${ctxId}">Why I made this</button>
                            <div class="collapse" id="${ctxId}"><p class="context-text mt-2 mb-0">${esc(p.context)}</p></div>
                        </div>` : ""}
                        <div class="mt-auto pt-3">
                            ${playControl(p)}
                            <a href="${esc(p.historyPage || "versions.html#" + slug(p.title))}" class="d-block text-center mt-3 link-accent">Version history</a>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // Model filter. Groups "Claude Opus 5.5" with "Opus 5.5"; an empty model is "Unknown".
        // Stores the models that are OFF, so models added to games.json later show by default.
        // From the All state, tapping a model isolates it; after that, taps toggle additively.
        const modelKey = p => (p.model || "").trim().replace(/^Claude\s+/i, "") || "Unknown";
        let modelsOff = new Set();
        try { modelsOff = new Set(JSON.parse(localStorage.getItem("vibes-models-off")) || []); } catch { modelsOff = new Set(); }
        function saveModelsOff() {
            try { localStorage.setItem("vibes-models-off", JSON.stringify([...modelsOff])); } catch {}
        }

        let filterModels = [];
        function renderFilter() {
            const counts = new Map();
            projects.filter(p => !p.hidden).forEach(p => counts.set(modelKey(p), (counts.get(modelKey(p)) || 0) + 1));
            const models = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
            filterModels = models.map(([m]) => m);
            const allOn = filterModels.every(m => !modelsOff.has(m));
            const noneOn = filterModels.every(m => modelsOff.has(m));
            document.getElementById("model-filter").innerHTML =
                `<button type="button" class="model-chip all-chip" data-model-all aria-pressed="${allOn}">All</button>` +
                `<button type="button" class="model-chip none-chip" data-model-none aria-pressed="${noneOn}">None</button>` +
                models.map(([m, n]) => `<button type="button" class="model-chip" data-model="${esc(m)}" aria-pressed="${!modelsOff.has(m)}">${esc(m)} (${n})</button>`).join("");
        }

        document.getElementById("model-filter").addEventListener("click", e => {
            const btn = e.target.closest(".model-chip");
            if (!btn) return;
            const m = btn.dataset.model;
            if (btn.hasAttribute("data-model-all")) modelsOff.clear();
            else if (btn.hasAttribute("data-model-none")) filterModels.forEach(x => modelsOff.add(x));
            else if (filterModels.every(x => !modelsOff.has(x))) modelsOff = new Set(filterModels.filter(x => x !== m));
            else if (modelsOff.has(m)) modelsOff.delete(m);
            else modelsOff.add(m);
            saveModelsOff();
            render(currentSort);
            const again = btn.hasAttribute("data-model-all") ? document.querySelector("[data-model-all]")
                : btn.hasAttribute("data-model-none") ? document.querySelector("[data-model-none]")
                : [...document.querySelectorAll("[data-model]")].find(b => b.dataset.model === m);
            if (again) again.focus();
        });

        let currentSort = "default";
        function render(sort) {
            currentSort = sort;
            renderFilter();
            const list = projects.map((p, i) => ({p, i}));
            if (sort === "updated") {
                list.sort((a, b) => (b.p.updated || "").localeCompare(a.p.updated || "") || a.i - b.i);
            }
            for (const kind of ["game", "app"]) {
                const shown = list.filter(({p}) => p.kind === kind && !p.hidden && !modelsOff.has(modelKey(p)));
                document.getElementById(kind + "s").innerHTML = shown.length
                    ? shown.map(({p, i}) => card(p, i)).join("")
                    : '<p class="no-match mt-4 mb-0">No projects match the selected models.</p>';
            }
            document.querySelectorAll("[data-sort]").forEach(b => {
                b.classList.toggle("active", b.dataset.sort === sort);
                b.setAttribute("aria-pressed", b.dataset.sort === sort);
            });
        }

        function savedSort() {
            try { return localStorage.getItem("vibes-sort") || "default"; } catch { return "default"; }
        }

        document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
            try { localStorage.setItem("vibes-sort", b.dataset.sort); } catch {}
            render(b.dataset.sort);
        }));

        fetch("games.json")
            .then(r => r.json())
            .then(data => { projects = data.projects; render(savedSort()); })
            .catch(() => {
                document.getElementById("games").innerHTML =
                    '<p class="mt-4 text-center">Couldn\'t load games.json. If you opened this file directly, serve the folder instead: <code>python3 -m http.server</code></p>';
            });
    </script>
</body>
</html>
