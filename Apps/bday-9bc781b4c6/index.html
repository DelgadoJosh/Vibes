<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jacop's Birthday Countdown</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
<style>
  :root {
    --sky1: #bfe9ff; --sky2: #fff1f8;
    --ink: #3b2c4a; --soft: #6d5a7d;
    --card: #ffffffcc; --accent: #ff7aa8; --accent2: #7ac8ff; --gold: #ffcf3f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky1), var(--sky2) 70%);
    min-height: 100vh; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  body.party { background: linear-gradient(180deg, #ffd6ec, #fff6c9 70%); transition: background 1.5s; }
  main { width: 100%; max-width: 900px; padding: 20px 16px 32px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

  h1 { margin: 6px 0 0; text-align: center; font-size: clamp(26px, 6vw, 48px); line-height: 1.1; }
  .sub { margin: 0; color: var(--soft); text-align: center; font-size: clamp(14px, 3.4vw, 18px); }
  .party h1 {
    background: linear-gradient(90deg, #ff5e9c, #ffb13b, #5ec8ff, #b07cff, #ff5e9c);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 4s linear infinite, pop .8s cubic-bezier(.3,1.8,.5,1);
    font-size: clamp(32px, 8vw, 64px);
  }
  @keyframes rainbow { to { background-position: 300% 0; } }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .clock { display: flex; gap: clamp(6px, 2vw, 14px); justify-content: center; flex-wrap: nowrap; }
  .unit {
    background: var(--card); border-radius: 18px; padding: 10px 6px 8px;
    width: clamp(68px, 20vw, 110px); text-align: center;
    box-shadow: 0 6px 0 #0000000f, 0 10px 24px #6d5a7d22;
  }
  .unit b { display: block; font-size: clamp(30px, 9vw, 54px); font-variant-numeric: tabular-nums; }
  .unit span { font-size: clamp(11px, 2.8vw, 14px); color: var(--soft); text-transform: uppercase; letter-spacing: .08em; }
  .party .clock { display: none; }

  .status { min-height: 1.4em; color: var(--soft); font-style: italic; text-align: center; transition: opacity .4s; }

  .scene { width: 100%; max-width: 820px; }
  .scene svg { width: 100%; height: auto; display: block; overflow: visible; }

  button {
    font: inherit; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    background: var(--accent); color: white; font-weight: bold; box-shadow: 0 4px 0 #c94d7b;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c94d7b; }
  button.alt { background: var(--accent2); box-shadow: 0 4px 0 #3e8fc4; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #partyButtons { display: none; }
  .party #partyButtons { display: flex; }

  #mute { position: fixed; top: 10px; right: 12px; z-index: 30; padding: 8px 12px; background: #ffffffcc; color: var(--ink); box-shadow: 0 3px 0 #0001; }

  #big {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 40vmin; font-weight: bold; color: #ff5e9c; text-shadow: 0 8px 0 #fff, 0 14px 30px #0002;
    pointer-events: none; z-index: 20;
  }
  #big.show { display: flex; }
  #big b { animation: tick 1s ease-out; }
  @keyframes tick { from { transform: scale(1.6); opacity: 0; } 30% { opacity: 1; } to { transform: scale(.8); opacity: .2; } }

  #gate {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    background: #bfe9ffee; padding: 16px;
  }
  #gate .card { background: white; border-radius: 24px; padding: 28px 22px; text-align: center; max-width: 360px; box-shadow: 0 12px 40px #6d5a7d33; }
  #gate .card div { font-size: 64px; animation: bob 1.2s ease-in-out infinite; }
  #gate p { color: var(--soft); }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  #debug { position: fixed; left: 10px; bottom: 10px; z-index: 30; background: #fffd; border-radius: 14px; padding: 8px; display: none; gap: 6px; flex-wrap: wrap; font-size: 13px; box-shadow: 0 4px 16px #0002; }
  #debug.on { display: flex; }
  #debug button { padding: 6px 10px; font-size: 13px; }

  /* ---------- duck animations ---------- */
  .waddle { transform-box: fill-box; transform-origin: 50% 100%; animation: waddle .6s ease-in-out infinite alternate; }
  @keyframes waddle { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .bob { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .hop { transform-box: fill-box; transform-origin: 50% 100%; animation: hop 1.1s ease-in-out infinite; }
  @keyframes hop { 0%,60%,100% { transform: translateY(0) scaleY(1); } 10% { transform: translateY(0) scaleY(.88); } 30% { transform: translateY(-26px) scaleY(1.05); } }

  .walk { transform-box: fill-box; transform-origin: 50% 50%; animation: walk 9s linear infinite; }
  @keyframes walk {
    0%   { transform: translateX(0) scaleX(1); }
    48%  { transform: translateX(150px) scaleX(1); }
    50%  { transform: translateX(150px) scaleX(-1); }
    98%  { transform: translateX(0) scaleX(-1); }
    100% { transform: translateX(0) scaleX(1); }
  }

  .inflate { transform-box: fill-box; transform-origin: 0% 100%; animation: inflate 3.2s ease-in-out infinite; }
  @keyframes inflate { 0% { transform: scale(.25); } 15% { transform: scale(.4); } 30% { transform: scale(.38); } 45% { transform: scale(.6); } 60% { transform: scale(.58); } 80% { transform: scale(1); } 92% { transform: scale(1); opacity: 1; } 100% { transform: scale(.25); opacity: .6; } }
  .puff { transform-box: fill-box; transform-origin: center; animation: puff 3.2s ease-in-out infinite; }
  @keyframes puff { 0%,30%,60%,100% { transform: scale(1); } 15%,45%,75% { transform: scale(1.5); } }

  .shake { transform-box: fill-box; transform-origin: 50% 100%; animation: shake 1.8s ease-in-out infinite; }
  @keyframes shake { 0%,60%,100% { transform: rotate(0); } 65% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } 85% { transform: rotate(-5deg); } 95% { transform: rotate(3deg); } }

  .sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 3s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

  .flag { transform-box: fill-box; transform-origin: 50% 0%; animation: flagdrop 6s ease-in-out infinite; }
  @keyframes flagdrop { 0%,8% { transform: scaleY(0); } 18%,100% { transform: scaleY(1); } }

  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .25s ease-in-out infinite alternate; }
  @keyframes flicker { from { transform: scale(1, 1) rotate(-4deg); } to { transform: scale(.85, 1.15) rotate(4deg); } }

  .partyOnly { opacity: 0; transition: opacity .6s; }
  .party .partyOnly { opacity: 1; }
  .party .prepOnly { display: none; }

  .party .jump { transform-box: fill-box; transform-origin: 50% 100%; animation: jump .7s cubic-bezier(.3,.7,.4,1) infinite alternate; }
  @keyframes jump { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-34px) rotate(6deg); } }
  .party .jump.late { animation-delay: .35s; }

  .floatUp { transform-box: fill-box; transform-origin: center; }
  .party .floatUp { animation: floatUp 7s ease-in infinite; }
  @keyframes floatUp { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, -520px); } }
  .party .floatUp.b2 { animation-delay: 1.5s; animation-duration: 8s; }
  .party .floatUp.b3 { animation-delay: 3s; animation-duration: 6.5s; }
  .party .floatUp.b4 { animation-delay: 4.2s; animation-duration: 7.5s; }

  @media (max-width: 560px) {
    main { padding-top: 56px; min-height: 100vh; justify-content: center; }
    .scene { width: calc(100% + 24px); margin: 0 -12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<button id="mute" title="Sound on/off">🔊</button>
<div id="big"></div>

<div id="gate">
  <div class="card">
    <div>🦆</div>
    <h2>The ducks are getting ready…</h2>
    <p>Tap to come in. (Turn your sound on for the big moment!)</p>
    <button id="enter">Let me in 🎉</button>
  </div>
</div>

<main>
  <h1 id="title">Jacop's 21st Birthday</h1>
  <p class="sub" id="when"></p>

  <div class="clock" aria-live="off">

    <div class="unit"><b id="h">00</b><span>hours</span></div>
    <div class="unit"><b id="m">00</b><span>minutes</span></div>
    <div class="unit"><b id="s">00</b><span>seconds</span></div>
  </div>

  <p class="status" id="status">The ducks are getting ready…</p>

  <div class="scene">
    <svg viewBox="0 10 800 370" role="img" aria-label="Ducks getting ready for a birthday party">
      <defs>
        <!-- one duck, facing right, standing on y=100 -->

          <ellipse cx="38" cy="98" rx="8" ry="3" fill="#ff9a2e"/>
          <ellipse cx="56" cy="98" rx="8" ry="3" fill="#ff9a2e"/>
          <path d="M10 62 Q2 50 8 44 Q14 54 22 56 Z" fill="#ffc81f"/>
          <ellipse cx="44" cy="70" rx="34" ry="25" fill="#ffd93b"/>
          <ellipse cx="40" cy="70" rx="17" ry="11" fill="#ffc81f" transform="rotate(-12 40 70)"/>
          <circle cx="66" cy="38" r="19" fill="#ffd93b"/>
          <path d="M80 38 Q96 36 98 42 Q92 48 80 46 Z" fill="#ff9a2e"/>
          <circle cx="71" cy="32" r="3.4" fill="#3b2c4a"/>
          <circle cx="72.2" cy="30.8" r="1.1" fill="#fff"/>
          <ellipse cx="70" cy="44" rx="5" ry="3" fill="#ff9fb8" opacity=".7"/>
        </symbol>
        <!-- accessories drawn in the duck's 100x100 frame: use them with the same size/transform as the duck -->
        <symbol id="beanie" viewBox="0 0 100 100" overflow="visible">
          <g transform="rotate(-14 66 26)">
            <path d="M48 28 Q49 5 66 5 Q83 5 84 28 Z" fill="#4fb3a9"/>
            <path d="M56 26 Q57 12 60 8 M66 26 L66 6 M76 26 Q75 12 72 8" stroke="#3d958c" stroke-width="2" fill="none"/>
            <rect x="45" y="23" width="42" height="9" rx="4.5" fill="#3d958c"/>
            <circle cx="66" cy="3" r="5.5" fill="#ff7aa8"/>
          </g>
        </symbol>
        <symbol id="glasses" viewBox="0 0 100 100" overflow="visible">
          <path d="M64.6 31 L50 28" stroke="#3b2c4a" stroke-width="2" stroke-linecap="round"/>
          <path d="M77.4 32 L81 33" stroke="#3b2c4a" stroke-width="2" stroke-linecap="round"/>
          <circle cx="71" cy="32" r="6.5" fill="#ffffff44" stroke="#3b2c4a" stroke-width="2"/>
        </symbol>
        <symbol id="bow" viewBox="0 0 100 100" overflow="visible">
          <path d="M69 28.5 L67 24.5 M72 27.8 L72.4 23.6 M74.8 28.8 L77 25.4" stroke="#3b2c4a" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M56 19 Q42 8 43 21 Q45 29 56 19 Z" fill="#ff5e9c"/>
          <path d="M56 19 Q64 4 70 15 Q69 25 56 19 Z" fill="#ff5e9c"/>
          <circle cx="56" cy="19" r="4" fill="#e8326f"/>
        </symbol>
        <symbol id="hat" viewBox="0 0 30 40" overflow="visible">
          <path d="M2 38 L15 2 L28 38 Z" fill="#7ac8ff"/>
          <path d="M6 28 L24 28 M9 18 L21 18" stroke="#fff" stroke-width="3"/>
          <circle cx="15" cy="2" r="4" fill="#ff7aa8"/>
        </symbol>
        <symbol id="balloon" viewBox="0 0 40 90" overflow="visible">
          <path d="M20 50 Q14 70 22 90" stroke="#9a8aa8" stroke-width="1.5" fill="none"/>
          <ellipse cx="20" cy="24" rx="18" ry="23" fill="currentColor"/>
          <path d="M17 47 L23 47 L20 52 Z" fill="currentColor"/>
          <ellipse cx="13" cy="15" rx="4" ry="7" fill="#fff" opacity=".45"/>
        </symbol>
      </defs>

      <!-- ground -->
      <ellipse cx="400" cy="372" rx="470" ry="46" fill="#9be38f"/>
      <ellipse cx="400" cy="366" rx="430" ry="30" fill="#b5ef9f"/>

      <!-- banner -->
      <g class="sway">
        <path d="M60 40 Q400 120 740 40" stroke="#9a8aa8" stroke-width="2" fill="none"/>
        <g id="flags"></g>
      </g>

      <!-- balloons released at the party -->
      <g class="partyOnly">
        <use href="#balloon" class="floatUp" x="90" y="170" width="40" height="90" style="color:#ff7aa8"/>
        <use href="#balloon" class="floatUp b2" x="300" y="150" width="40" height="90" style="color:#7ac8ff"/>
        <use href="#balloon" class="floatUp b3" x="520" y="170" width="40" height="90" style="color:#b07cff"/>
        <use href="#balloon" class="floatUp b4" x="690" y="160" width="40" height="90" style="color:#ffcf3f"/>
      </g>

      <g transform="translate(400 345) scale(1.04) translate(-400 -345)">
      <!-- Duck 1: blowing up a balloon -->
      <g transform="translate(24 230)">
        <g class="jump">
          <g class="bob">
            <use href="#duck" width="110" height="110"/>
            <g class="prepOnly">
              <g transform="translate(104 46)">
                <use href="#balloon" class="inflate" x="0" y="-120" width="56" height="126" style="color:#ff7aa8"/>
              </g>
              <circle class="puff" cx="78" cy="49" r="5" fill="#ffc81f"/>
            </g>
            <use href="#hat" class="partyOnly" x="58" y="-4" width="26" height="34" transform="rotate(12 71 13)"/>
          </g>
        </g>
      </g>

      <!-- Duck 2: carrying the cake back and forth -->
      <g transform="translate(196 250)" class="prepOnly">
        <g class="walk">
          <g class="waddle">
            <use href="#duck" width="96" height="96"/>
            <g transform="translate(60 40)">
              <rect x="0" y="10" width="44" height="26" rx="5" fill="#fff"/>
              <rect x="0" y="10" width="44" height="9" rx="4" fill="#ff9fb8"/>
              <rect x="20" y="0" width="4" height="11" fill="#7ac8ff"/>
              <rect x="-4" y="35" width="52" height="4" rx="2" fill="#c9b8d6"/>
            </g>
          </g>
        </g>
      </g>

      <!-- Duck 3: wrapping a present, in a beanie and round glasses -->
      <g transform="translate(500 248)">
        <g class="jump late">
          <g class="bob">
            <use href="#duck" width="100" height="100" transform="translate(100 0) scale(-1 1)"/>
            <use href="#glasses" width="100" height="100" transform="translate(100 0) scale(-1 1)"/>
            <use href="#beanie" width="100" height="100" transform="translate(100 0) scale(-1 1)"/>
            <g class="prepOnly" transform="translate(-36 54)"><g class="shake">
              <rect x="0" y="12" width="44" height="34" rx="4" fill="#b07cff"/>
              <rect x="18" y="12" width="8" height="34" fill="#ffcf3f"/>
              <rect x="-3" y="6" width="50" height="10" rx="3" fill="#c69cff"/>
              <path d="M22 6 Q10 -6 8 4 Q12 8 22 6 Q34 -6 36 4 Q32 8 22 6" fill="#ffcf3f"/>
            </g></g>
          </g>
        </g>
      </g>

      <!-- Mommy duck with a bow -->
      <g transform="translate(616 222)">
        <g class="jump">
          <g class="bob" style="animation-delay:.5s">
            <use href="#duck" width="120" height="120" transform="translate(120 0) scale(-1 1)"/>
            <use href="#bow" width="120" height="120" transform="translate(120 0) scale(-1 1)"/>

        </g>
      </g>

      <!-- Duckling with a party hat, hopping beside mommy -->
      <g transform="translate(712 300)">
        <g class="hop">
          <use href="#duck" width="62" height="62" transform="translate(62 0) scale(-1 1)"/>
          <use href="#hat" x="8" y="-14" width="18" height="24" transform="rotate(-14 17 -2)"/>
        </g>
      </g>

      <!-- The party: cake with 21 candles-worth -->
      <g class="partyOnly" transform="translate(300 220)">
        <rect x="20" y="118" width="160" height="10" rx="5" fill="#c9b8d6"/>
        <rect x="30" y="70" width="140" height="50" rx="10" fill="#fff"/>
        <path d="M30 84 Q47 98 64 84 Q81 98 98 84 Q115 98 132 84 Q149 98 170 84 L170 76 Q170 70 160 70 L40 70 Q30 70 30 78 Z" fill="#ff9fb8"/>
        <rect x="50" y="22" width="100" height="50" rx="10" fill="#d4bcff"/>
        <path d="M50 34 Q62 46 75 34 Q88 46 100 34 Q112 46 125 34 Q138 46 150 34 L150 30 Q150 22 142 22 L58 22 Q50 22 50 30 Z" fill="#7ac8ff"/>
        <text x="100" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#ff5e9c" font-family="Trebuchet MS, sans-serif">21</text>
        <g>
          <rect x="82" y="-2" width="7" height="25" rx="2" fill="#ffcf3f"/>
          <rect x="111" y="-2" width="7" height="25" rx="2" fill="#b07cff"/>
          <path class="flame" d="M85.5 -16 Q80 -6 85.5 -3 Q91 -6 85.5 -16 Z" fill="#ff9a2e"/>
          <path class="flame" d="M114.5 -16 Q109 -6 114.5 -3 Q120 -6 114.5 -16 Z" fill="#ff9a2e"/>
        </g>
        <!-- the cake duck, now standing proudly beside it -->
        <g transform="translate(-72 32)">
          <g class="jump">
            <use href="#duck" width="96" height="96"/>
            <use href="#hat" x="52" y="-8" width="24" height="32" transform="rotate(10 64 8)"/>
          </g>
        </g>
      </g>
      </g>
    </svg>
  </div>

  <div class="row" id="partyButtons">
    <button id="again">🎶 Play the song</button>
    <button id="more" class="alt">🎊 More confetti</button>
  </div>
</main>

<div id="debug">
  <b style="align-self:center">Debug</b>
  <button id="dbg10">Party in 10 s</button>
  <button id="dbgReset" class="alt">Back to real time</button>
</div>

<script>
"use strict";
// ---------- the date ----------
// Midnight at the start of Nov 17, 2026 in New York (US Eastern), whatever the viewer's own timezone.
const NAME = "Jacop";
function nyMidnight(y, month, day) {
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric" });
  for (const offsetHours of [5, 4]) { // EST, then EDT
    const t = Date.UTC(y, month - 1, day, offsetHours);
    const p = Object.fromEntries(fmt.formatToParts(t).map(x => [x.type, x.value]));
    if (+p.day === day && +p.hour === 0) return t;
  }
  return Date.UTC(y, month - 1, day, 5);
}
const REAL_TARGET = nyMidnight(2026, 11, 17);
let target = REAL_TARGET;

const $ = id => document.getElementById(id);
$("when").textContent = new Date(REAL_TARGET).toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "long", month: "long", day: "numeric", year: "numeric" }) + " · midnight Eastern time";

// ---------- banner flags ----------
(function makeFlags() {
  const colors = ["#ff7aa8", "#ffcf3f", "#7ac8ff", "#b07cff", "#8fe08a"];
  const g = $("flags");
  const n = 13;
  for (let i = 0; i < n; i++) {
    const x = 90 + i * (620 / (n - 1));
    const tt = (x - 60) / 680; // position along the quadratic curve
    const y = (1 - tt) * (1 - tt) * 40 + 2 * (1 - tt) * tt * 120 + tt * tt * 40;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", `M${x - 16} ${y} L${x + 16} ${y} L${x} ${y + 36} Z`);
    p.setAttribute("fill", colors[i % colors.length]);
    p.setAttribute("class", "flag");
    p.style.animationDelay = (i * 0.35) + "s";
    g.appendChild(p);
  }
})();

// ---------- sound (all made in the browser, no files) ----------
let ctx = null, muted = false, master = null;
function audio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
function tone(freq, t, dur, { type = "sine", vol = 0.25, attack = 0.01 } = {}) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
// New quack (2026-11-15): a buzzy low voice through two moving "nasal" formants, with a fast wobble.
function quack(t, pitch = 1) {
  if (USE_CLASSIC_QUACK) return quackClassic(t, pitch);
  const dur = 0.3;
  const out = ctx.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(0.9, t + 0.015);
  out.gain.exponentialRampToValueAtTime(0.55, t + 0.12);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const wob = ctx.createGain(); wob.gain.value = 0.75;
  const lfo = ctx.createOscillator(), lfoAmt = ctx.createGain();
  lfo.frequency.value = 38; lfoAmt.gain.value = 0.25; lfo.connect(lfoAmt); lfoAmt.connect(wob.gain);
  const oscs = [["sawtooth", 1], ["square", 1.012]].map(([type, det]) => {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(230 * pitch * det, t);
    o.frequency.linearRampToValueAtTime(320 * pitch * det, t + 0.05);
    o.frequency.exponentialRampToValueAtTime(190 * pitch * det, t + dur);
    o.connect(wob); return o;
  });
  for (const [f0, f1, f2, q, g] of [[800, 1250, 900, 6, 1], [2200, 2900, 2400, 9, 0.55]]) {
    const f = ctx.createBiquadFilter(), fg = ctx.createGain();
    f.type = "bandpass"; f.Q.value = q; fg.gain.value = g;
    f.frequency.setValueAtTime(f0 * pitch, t);
    f.frequency.linearRampToValueAtTime(f1 * pitch, t + 0.06);
    f.frequency.exponentialRampToValueAtTime(f2 * pitch, t + dur);
    wob.connect(f); f.connect(fg); fg.connect(out);
  }
  out.connect(master);
  for (const o of [...oscs, lfo]) { o.start(t); o.stop(t + dur + 0.05); }
}
// Original quack (v1, 2026-11-15): one sawtooth sliding 520 -> 300 Hz through a single bandpass.
// Set USE_CLASSIC_QUACK = true to go back to it.
const USE_CLASSIC_QUACK = false;
function quackClassic(t, pitch = 1) {
  const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(520 * pitch, t);
  o.frequency.exponentialRampToValueAtTime(300 * pitch, t + 0.16);
  f.type = "bandpass"; f.frequency.value = 1300 * pitch; f.Q.value = 3;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25);
}
function partyHorn(t) {
  const o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(660, t + 0.35);
  lfo.frequency.value = 9; lg.gain.value = 18; lfo.connect(lg); lg.connect(o.frequency);
  f.type = "lowpass"; f.frequency.value = 2400;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.05);
  g.gain.setValueAtTime(0.18, t + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); lfo.start(t); o.stop(t + 1); lfo.stop(t + 1);
}
const N = { F2: 87.31, G2: 98, C3: 130.81, F3: 174.61, G3: 196, C4: 261.63, G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
// "Happy Birthday to You" (public domain melody), in beats; bass on the bar's first note
const SONG = [
  ["G4", .75], ["G4", .25], ["A4", 1, "C3"], ["G4", 1], ["C5", 1], ["B4", 2, "G2"],
  ["G4", .75], ["G4", .25], ["A4", 1, "G2"], ["G4", 1], ["D5", 1], ["C5", 2, "C3"],
  ["G4", .75], ["G4", .25], ["G5", 1, "C3"], ["E5", 1], ["C5", 1], ["B4", 1, "F2"], ["A4", 2],
  ["F5", .75], ["F5", .25], ["E5", 1, "C3"], ["C5", 1], ["D5", 1, "G2"], ["C5", 3, "C3"],
];
function playSong(start) {
  const beat = 0.42;
  let t = start;
  for (const [note, beats, bass] of SONG) {
    const len = beats * beat;
    tone(N[note], t, Math.max(len, 0.35) + 0.3, { type: "triangle", vol: 0.22 });
    tone(N[note] * 2, t, 0.5, { type: "sine", vol: 0.07 }); // music-box sparkle
    if (bass) tone(N[bass], t, len * 2.5, { type: "sine", vol: 0.2, attack: 0.02 });
    t += len;
  }
  return t;
}
function celebrateSound() {
  if (muted || !audio()) return;
  const t = ctx.currentTime + 0.05;
  partyHorn(t); partyHorn(t + 0.15);
  [0, .2, .35, .6, .75].forEach((d, i) => quack(t + 0.9 + d, i % 2 ? 1.25 : 1));
  const end = playSong(t + 2.1);
  [0, .15, .3].forEach((d, i) => quack(end + 0.2 + d, 1 + i * 0.15));
  partyHorn(end + 0.7);
}
function tickSound(n) {
  if (muted || !ctx || ctx.state !== "running") return;
  tone(n <= 3 ? 880 : 660, ctx.currentTime + 0.01, 0.15, { type: "square", vol: 0.06 });
}

$("mute").onclick = () => {
  muted = !muted;
  $("mute").textContent = muted ? "🔇" : "🔊";
  if (master) master.gain.value = muted ? 0 : 0.6;
};
$("enter").onclick = () => {
  $("gate").style.display = "none";
  if (partied) { celebrateSound(); confetti(); }
  else if (audio()) { quack(ctx.currentTime + 0.05, 1.1); quack(ctx.currentTime + 0.33, 1.25); }
};

// ---------- confetti ----------
const cv = $("confetti"), cx = cv.getContext("2d");
let bits = [], raining = 0;
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();
const CCOLORS = ["#ff5e9c", "#ffcf3f", "#5ec8ff", "#b07cff", "#7be07a", "#ff9a2e"];
function burst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 10;
    bits.push(newBit(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 6));
  }
}
function newBit(x, y, vx, vy) {
  return { x, y, vx, vy, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, c: CCOLORS[Math.random() * CCOLORS.length | 0],
    round: Math.random() < .25, wob: Math.random() * 10 };
}
function drawConfetti() {
  const W = innerWidth, H = innerHeight;
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.clearRect(0, 0, W, H);
  if (raining > 0) { raining--; for (let i = 0; i < 3; i++) bits.push(newBit(Math.random() * W, -10, (Math.random() - .5) * 2, 1 + Math.random() * 2)); }
  for (const b of bits) {
    b.vy += 0.18; b.vx *= 0.985; b.vy = Math.min(b.vy, 4.5);
    b.wob += 0.1; b.x += b.vx + Math.sin(b.wob) * 0.6; b.y += b.vy; b.r += b.vr;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c;
    if (b.round) { cx.beginPath(); cx.arc(0, 0, b.w / 2, 0, 7); cx.fill(); }
    else { cx.scale(1, Math.cos(b.wob)); cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); }
    cx.restore();
  }
  bits = bits.filter(b => b.y < H + 20);
  if (bits.length || raining > 0) requestAnimationFrame(drawConfetti);
  else cx.clearRect(0, 0, W, H);
}
function confetti() {
  const W = innerWidth, H = innerHeight;
  const go = !bits.length && raining <= 0;
  burst(W * 0.2, H * 0.55, 90); burst(W * 0.8, H * 0.55, 90);
  setTimeout(() => burst(W * 0.5, H * 0.35, 120), 350);
  raining = 60 * 12; // about 12 s of falling confetti
  if (go) requestAnimationFrame(drawConfetti);
}
$("more").onclick = () => { confetti(); if (!muted && audio()) { quack(ctx.currentTime + .02); quack(ctx.currentTime + .2, 1.3); } };
$("again").onclick = () => { celebrateSound(); };

// ---------- the countdown ----------
const PREP = [
  "Blowing up balloons…", "Frosting the cake…", "Hanging the banner…", "Wrapping the present…",
  "Practicing their quacks…", "Polishing their party hats…", "Counting the candles (21!)…", "Rehearsing the song…",
];
let partied = false, lastSec = null, prepIdx = 0;
function pad(n) { return String(n).padStart(2, "0"); }
function startParty(withSound) {
  partied = true;
  document.body.classList.add("party");
  $("title").textContent = `Happy 21st Birthday ${NAME}!`;
  $("status").textContent = "The ducks say: QUACK QUACK HOORAY! 🦆🎉";
  $("when").textContent = "Have the best birthday ever! 🎂";
  $("big").classList.remove("show");
  document.title = `Happy 21st Birthday ${NAME}! 🎉`;
  confetti();
  if (withSound) celebrateSound();
}
function resetPrep() {
  partied = false;
  document.body.classList.remove("party");
  $("title").textContent = `${NAME}'s 21st Birthday`;
  $("when").textContent = new Date(REAL_TARGET).toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "long", month: "long", day: "numeric", year: "numeric" }) + " · midnight Eastern time";
  document.title = `${NAME}'s Birthday Countdown`;
  bits = []; raining = 0;
}
function update() {
  const left = target - Date.now();
  if (left <= 0) {
    // Only make noise when the countdown runs out while the page is open, not on a later visit.
    if (!partied) startParty(left > -60000);
    return;
  }
  if (partied) resetPrep();
  const sec = Math.ceil(left / 1000);
  $("d").textContent = Math.floor(sec / 86400);
  $("h").textContent = pad(Math.floor(sec / 3600) % 24);
  $("m").textContent = pad(Math.floor(sec / 60) % 60);
  $("s").textContent = pad(sec % 60);
  if (sec !== lastSec) {
    lastSec = sec;
    if (sec <= 10) {
      $("big").innerHTML = `<b>${sec}</b>`;
      $("big").classList.add("show");
      $("status").textContent = "Ducks, places everyone!";
      tickSound(sec);
    } else {
      $("big").classList.remove("show");
      if (sec <= 60) $("status").textContent = "Almost time! Everyone hide behind the cake…";
      else if (sec % 5 === 0) { prepIdx = (prepIdx + 1) % PREP.length; $("status").textContent = "The ducks are " + PREP[prepIdx][0].toLowerCase() + PREP[prepIdx].slice(1); }
    }
  }
}
$("status").textContent = "The ducks are " + PREP[0].toLowerCase();
setInterval(update, 200);
update();

// ---------- debug: add ?debug to the URL ----------
if (new URLSearchParams(location.search).has("debug")) {
  $("debug").classList.add("on");
  $("dbg10").onclick = () => { audio(); target = Date.now() + 10000; lastSec = null; update(); };
  $("dbgReset").onclick = () => { target = REAL_TARGET; lastSec = null; update(); };
}
</script>
